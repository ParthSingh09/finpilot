version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: finpilot_postgres
    environment:
      POSTGRES_USER: finpilot_user
      POSTGRES_PASSWORD: finpilot_secure_password
      POSTGRES_DB: finpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot_user -d finpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finpilot_backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./finpilot.db
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./finpilot.db:/app/finpilot.db

  frontend:
    image: node:20-alpine
    container_name: finpilot_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
